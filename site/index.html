<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Counting down...">
    <meta name="theme-color" content="#080c0a">
    <title>Countdown</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23080c0a'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='monospace' font-size='44' fill='%2375fbaa'%3E0%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <script src="countdown.js" defer></script>
  </head>
  <body>
    <main>
      <div class="countdown" aria-label="Time remaining" role="timer" aria-live="off">
        <div class="unit"><span class="number" id="days">--</span><span class="label">days</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span class="number" id="hours">--</span><span class="label">hours</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span class="number" id="minutes">--</span><span class="label">mins</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span class="number" id="seconds">--</span><span class="label">secs</span></div>
      </div>
      <p class="sr-only" id="status" role="status"></p>
      <noscript><p>Enable JavaScript to run the countdown.</p></noscript>
    </main>
  </body>
</html>
